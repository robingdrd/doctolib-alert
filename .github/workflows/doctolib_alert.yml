name: Doctolib Alert

on:
  workflow_dispatch:
    inputs:
      test_praticien:
        description: "Id du praticien pour simuler une alerte TEST (ex: mouton). Vide = run normal."
        required: false
        default: ""

jobs:
  check-availability:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restaurer le cache des creneaux vus
        uses: actions/cache@v4
        with:
          path: seen_slots_*.json
          key: seen-slots-${{ github.run_id }}
          restore-keys: seen-slots-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifier les creneaux Doctolib
        env:
          EMAIL_DESTINATAIRE: ${{ secrets.EMAIL_DESTINATAIRE }}
          EMAIL_DESTINATAIRE_2: ${{ secrets.EMAIL_DESTINATAIRE_2 }}
          EMAIL_EXPEDITEUR:   ${{ secrets.EMAIL_EXPEDITEUR }}
          EMAIL_MOT_DE_PASSE: ${{ secrets.EMAIL_MOT_DE_PASSE }}
          TEST_PRATICIEN: ${{ inputs.test_praticien }}
        run: python doctolib_alert.py
